name: smart-hospital
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smart_hospital
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medplum}
    command: ['postgres', '-c', 'default_transaction_isolation=REPEATABLE READ', '-c', 'statement_timeout=60000']
    ports: ['127.0.0.1:${POSTGRES_PORT:-5432}:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medplum -d smart_hospital']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  redis:
    image: redis:7
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-medplum}', '--appendonly', 'yes']
    ports: ['127.0.0.1:${REDIS_PORT:-6379}:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-medplum}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
