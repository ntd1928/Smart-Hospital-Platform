name: smart-hospital
x-backend-environment: &backend-environment
  MEDPLUM_DATABASE_HOST: postgres
  MEDPLUM_DATABASE_PORT: 5432
  MEDPLUM_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-medplum}
  MEDPLUM_REDIS_HOST: redis
  MEDPLUM_REDIS_PORT: 6379
  MEDPLUM_REDIS_PASSWORD: ${REDIS_PASSWORD:-medplum}
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smart_hospital
      POSTGRES_USER: medplum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medplum}
    command: ['postgres', '-c', 'default_transaction_isolation=REPEATABLE READ', '-c', 'statement_timeout=60000']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medplum -d smart_hospital']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  redis:
    image: redis:7
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-medplum}', '--appendonly', 'yes']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-medplum}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  seed:
    build:
      context: .
      target: seed
    environment:
      <<: *backend-environment
      DEMO_PASSWORD: ${DEMO_PASSWORD:-HospitalDemo!2026}
    volumes: ['demo-data:/app/.runtime']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    restart: 'no'
  server:
    build:
      context: .
      target: server
    environment: *backend-environment
    ports: ['127.0.0.1:8103:8103']
    volumes: ['binary-data:/app/packages/server/binary']
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8103/healthcheck').then(r=>r.json()).then(h=>process.exit(h.ok&&h.postgres&&h.redis?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
  web:
    build:
      context: .
      target: web
    ports: ['127.0.0.1:3000:8080']
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthcheck']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  demo-data:
  binary-data:
