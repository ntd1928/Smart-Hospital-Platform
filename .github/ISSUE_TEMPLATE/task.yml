name: Team task
description: Công việc có owner và tiêu chí nghiệm thu
body:
  - type: input
    id: task
    attributes:
      label: Task ID và tuần
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Người phụ trách
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Đầu ra và tiêu chí nghiệm thu
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Test, bằng chứng và phụ thuộc
