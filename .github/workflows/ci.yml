name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  integration:
    name: Integration
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.21.1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run services:up
      - run: npm run build
      - run: npm run seed
      - name: Start API and wait for dependencies
        shell: bash
        run: |
          npm run start -w @smart-hospital/server > "$RUNNER_TEMP/smart-hospital-api.log" 2>&1 &
          api_pid=$!
          for attempt in {1..60}; do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "API process exited; inspect the runner-local log."
              exit 1
            fi
            if curl --fail --silent http://localhost:8103/healthcheck | node --input-type=module -e '
              let body = "";
              for await (const chunk of process.stdin) body += chunk;
              try {
                const health = JSON.parse(body);
                process.exit(health.ok && health.postgres && health.redis ? 0 : 1);
              } catch { process.exit(1); }
            '; then
              exit 0
            fi
            sleep 2
          done
          echo "API readiness timed out."
          exit 1
      - run: npm run test:api
      - run: npm run test:e2e
      - name: Stop CI services
        if: always()
        run: docker compose down
